<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRO — Realtime Chat</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><aside><div class="brand">VYRO<span>●</span></div><div class="label">ROOMS</div><button class="room active" data-room="general">🌐 General</button><button class="room" data-room="gaming">🎮 Gaming</button><button class="room" data-room="music">🎵 Music</button><button class="room" data-room="coding">💻 Coding</button><div class="side-bottom"><span>Realtime</span><b id="status">OFFLINE</b></div></aside><main><header><div><div class="eyebrow">LIVE CHAT</div><h1 id="roomTitle"># General</h1></div><div class="user"><span class="dot"></span><input id="username" maxlength="24" value="Guest" aria-label="Username"></div></header><section class="messages" id="messages"></section><div class="typing" id="typing"></div><form id="form"><input id="input" maxlength="1000" autocomplete="off" placeholder="Write a message…"><button>➤</button></form></main><section class="members"><div class="members-title">ONLINE <span id="count">0</span></div><div id="memberList"></div><div class="pulse"><b>⚡ VYRO Pulse</b><p>Realtime communication, built for communities.</p></div></section></div><div id="welcome" class="modal"><div class="card"><div class="logo">V</div><h2>Welcome to VYRO</h2><p>Choose a username to enter the chat.</p><input id="welcomeName" maxlength="24" placeholder="Your username"><button id="enter">Enter VYRO</button></div></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
