<!doctype html><html><body><h2>Login</h2><input id='u' placeholder='username'><input id='p' placeholder='password' type='password'><button onclick='go()'>Login</button><pre id='r'></pre><script>async function go(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});document.getElementById('r').textContent=await r.text()}</script></body></html>
