<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth-box">
  <h1>💬 ChatRom</h1>
  <div class="tabs">
    <button onclick="showAuth('login')">ورود</button>
    <button onclick="showAuth('register')">ثبت نام</button>
  </div>

  <div id="loginForm">
    <input id="loginUser" placeholder="نام کاربری">
    <input id="loginPass" type="password" placeholder="رمز عبور">
    <button onclick="login()">ورود</button>
  </div>

  <div id="registerForm" style="display:none">
    <input id="registerUser" placeholder="نام کاربری">
    <input id="registerPass" type="password" placeholder="رمز عبور">
    <input id="registerPass2" type="password" placeholder="تکرار رمز عبور">
    <button onclick="register()">ساخت حساب</button>
  </div>
</div>

<div id="chatApp" class="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">💬 ChatRom</div>
    <div class="profile">کاربر</div>
  </aside>
  <main class="chatbox">
    <header>گفتگوی عمومی</header>
    <section id="messages"></section>
    <footer>
      <input id="input" placeholder="پیام بنویسید...">
      <button onclick="sendMessage()">➤</button>
    </footer>
  </main>
</div>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
