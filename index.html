<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>ChatRom</h1>
    <div class="user">🟢 کاربر آنلاین</div>
    <div class="chat">گفتگوی عمومی</div>
    <div class="chat">دوستان</div>
  </aside>
  <main class="chatbox">
    <header>💬 گفتگوی سریع</header>
    <section id="messages">
      <div class="msg">سلام! به ChatRom خوش آمدید</div>
    </section>
    <footer>
      <input id="input" placeholder="پیام خود را بنویسید...">
      <button onclick="sendMessage()">ارسال</button>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
