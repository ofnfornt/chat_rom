<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatRom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">💬 ChatRom</div>
    <div class="profile"><div class="avatar">👤</div><div><b>کاربر آنلاین</b><span>🟢 فعال</span></div></div>
    <div class="chat active">گفتگوی عمومی</div>
    <div class="chat">دوستان</div>
    <div class="chat">گروه‌ها</div>
  </aside>
  <main class="chatbox">
    <header><b>💬 گفتگوی سریع</b><small> آنلاین</small></header>
    <section id="messages">
      <div class="msg received">سلام! به ChatRom خوش آمدید</div>
    </section>
    <footer>
      <button class="attach">📎</button>
      <input id="input" placeholder="پیام خود را بنویسید...">
      <button onclick="sendMessage()">➤</button>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
