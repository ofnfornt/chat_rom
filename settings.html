<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChatRom Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="settings-box">
<h1>تنظیمات پروفایل</h1>
<img id="avatarPreview" src="avatar.png" class="avatar">
<input type="file" id="avatar" accept="image/*">
<input id="username" placeholder="نام کاربر">
<input id="displayName" placeholder="نام نمایشی">
<textarea id="bio" placeholder="بیوگرافی"></textarea>
<button onclick="saveProfile()">ذخیره تغییرات</button>
</div>
<script src="settings.js"></script>
</body>
</html>
